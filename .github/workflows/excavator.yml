# Checks the three projects for new GitHub releases every few hours and updates the manifests (version, URL, hash).
name: Excavator
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'
permissions:
  contents: write
jobs:
  excavate:
    name: Excavator
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Excavator
        uses: ScoopInstaller/GithubActions@v1
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
